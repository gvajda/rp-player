name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version
      - name: Run tests with coverage
        run: swift test --enable-code-coverage
      - name: Convert coverage to lcov
        uses: sersoft-gmbh/swift-coverage-action@v4
        id: cov
        with:
          search-paths: ./.build
          format: lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ join(fromJSON(steps.cov.outputs.files), ',') }}
          use_oidc: true
          fail_ci_if_error: false

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version

      - name: Extract version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build arm64 .app
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          SIGN_IDENTITY: "-"
        run: ./scripts/make-app.sh release

      - name: Build x86_64 binary
        run: |
          swift build -c release --triple x86_64-apple-macosx14.0
          install_name_tool -add_rpath "@loader_path/../Frameworks" \
            .build/x86_64-apple-macosx/release/RPPlayer

      - name: Merge to universal binary
        run: |
          APP="build/RP Player.app"
          BIN="$APP/Contents/MacOS/RP Player"
          lipo -create "$BIN" .build/x86_64-apple-macosx/release/RPPlayer -output "$BIN.universal"
          mv "$BIN.universal" "$BIN"
          codesign --force --options runtime \
            --entitlements scripts/entitlements.plist \
            --sign "-" "$BIN"
          codesign --force --options runtime \
            --entitlements scripts/entitlements.plist \
            --sign "-" "$APP"

      - name: Verify codesigning
        run: codesign --verify --deep --verbose "build/RP Player.app"

      - name: Verify universal binary
        run: lipo -info "build/RP Player.app/Contents/MacOS/RP Player"

      - name: Zip
        run: |
          cd build
          zip -r "RP Player-${GITHUB_REF_NAME}.zip" "RP Player.app"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG \
            "build/RP Player-${GITHUB_REF_NAME}.zip"
