name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Select latest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version
      - name: Install xcbeautify (JUnit converter)
        run: brew install xcbeautify
      - name: Run tests with coverage
        run: |
          set -o pipefail
          mkdir -p build/reports
          swift test --enable-code-coverage 2>&1 | tee build/reports/swift-test.log | xcbeautify --report junit --report-path build/reports
      - name: Publish test report
        if: success() || failure()
        uses: dorny/test-reporter@v2
        with:
          name: Tests
          path: build/reports/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload test logs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/reports/
          retention-days: 14
      - name: Convert coverage to lcov
        uses: sersoft-gmbh/swift-coverage-action@v5
        id: cov
        with:
          search-paths: ./.build
          format: lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ${{ join(fromJSON(steps.cov.outputs.files), ',') }}
          use_oidc: true
          fail_ci_if_error: false

  # Decides whether this push publishes a release. Two entry points:
  #   - push to main: tag = top `## [vX.Y.Z]` heading in CHANGELOG.md
  #   - push of a v* tag: tag = the tag name
  # Either way the commit must already be on main and the release must not exist yet.
  plan-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag and guards
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(grep -m1 -oE '^## \[v[0-9]+\.[0-9]+\.[0-9]+[^]]*\]' CHANGELOG.md | sed -E 's/^## \[(.*)\]$/\1/' || true)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ -z "$TAG" ]]; then
            echo "no versioned CHANGELOG section found -> no release"
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on main -> no release"
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists -> no release"
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          scripts/extract-changelog.sh "$TAG" >/dev/null
          echo "will release $TAG from $GITHUB_SHA"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: [test, plan-release]
    if: needs.plan-release.outputs.release == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version

      - name: Extract version from tag
        id: ver
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build arm64 .app
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          SIGN_IDENTITY: "-"
        run: ./scripts/make-app.sh release

      - name: Build x86_64 binary
        run: |
          swift build -c release --triple x86_64-apple-macosx14.0
          install_name_tool -add_rpath "@loader_path/../Frameworks" \
            .build/x86_64-apple-macosx/release/RPPlayer

      - name: Merge to universal binary
        run: |
          APP="build/RP Player.app"
          BIN="$APP/Contents/MacOS/RP Player"
          lipo -create "$BIN" .build/x86_64-apple-macosx/release/RPPlayer -output "$BIN.universal"
          mv "$BIN.universal" "$BIN"
          codesign --force --options runtime \
            --entitlements scripts/entitlements.plist \
            --sign "-" "$BIN"
          codesign --force --options runtime \
            --entitlements scripts/entitlements.plist \
            --sign "-" "$APP"

      - name: Verify codesigning
        run: codesign --verify --deep --verbose "build/RP Player.app"

      - name: Verify universal binary
        run: lipo -info "build/RP Player.app/Contents/MacOS/RP Player"

      - name: Create DMG
        run: |
          mkdir -p build/dmg-staging
          cp -r "build/RP Player.app" "build/dmg-staging/RP Player.app"
          ln -s /Applications "build/dmg-staging/Applications"
          scripts/extract-getting-started.sh "build/dmg-staging/Getting Started.txt"
          hdiutil create \
            -volname "RP Player" \
            -srcfolder "build/dmg-staging" \
            -ov \
            -format UDZO \
            "build/RP Player-${TAG}.dmg"

      - name: Extract changelog notes
        run: |
          scripts/extract-changelog.sh "$TAG" build/release-notes.md

      # --target creates the tag on this commit when it doesn't exist yet (main-push path);
      # on the tag-push path the tag already exists and --target is ignored.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file build/release-notes.md \
            $PRERELEASE_FLAG \
            "build/RP Player-${TAG}.dmg"
